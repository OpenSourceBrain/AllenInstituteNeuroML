name: Continuous builds

on:
  push:
    branches: [ master, development, experimental, pg*, add* ]
  pull_request:
    branches: [ master, development, experimental, pg*, add* ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ] # allensdk doesn't work with py 3.12...
        engine: ["NEURON", "PyNEURON", "NEURON:8.1", "PyNEURON:8.1", "jNeuroML", "jNeuroML_NEURON", "jNeuroML_NetPyNE", "jNeuroML_validate"]


    steps:
    - uses: actions/checkout@v6

    - name: Set up Python  ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version:  ${{ matrix.python-version }}

    - name: Install OMV
      run: |
        pip install git+https://github.com/OpenSourceBrain/osb-model-validation
        pip install scipy sympy matplotlib cython pandas tables
        pip install setuptools==80 # needed for Neuron on py 3.12

    - name: Download selected NEURON models
      if: ${{ contains( matrix.engine, 'NEURON' ) }}
      run: |
         pip install allensdk # for NEURON models
         cd CellTypesDatabase/models
         pip install markupsafe==2.0.1
         python download.py # NWB files here are required for tests
         ls -alt 4*

    - name: Run OMV tests on engine ${{ matrix.engine }}
      run: |
        omv all -V --engine=${{ matrix.engine }}

    - name: Print final OMV/engine version info
      run: |
        omv list -V # list installed engines
